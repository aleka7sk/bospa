name: source-snapshot

on:
  push:
    branches:
      - feat/bospa-pwa-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: bospa-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
          if-no-files-found: error
          retention-days: 1
