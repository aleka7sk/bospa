name: consolidate-runtime
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths: [.github/consolidate-runtime.trigger]
permissions:
  contents: write
concurrency:
  group: bospa-runtime-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-go@v5
        with: {go-version: 1.27.1, cache: false}
      - name: Consolidate authenticated runtime safely
        shell: bash
        run: |
          set -euo pipefail
          sleep 35
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python - <<'PY'
          from pathlib import Path
          import re

          runtime=Path('src/app-parts/00-remote-api-runtime.js')
          source=runtime.read_text()

          old_observer="""    const observer = new MutationObserver(() => mountRemoteIndicator());
              observer.observe(document.documentElement, {subtree:true, childList:true});"""
          new_observer="""    const observer = new MutationObserver(() => {
                if (!document.querySelector('[data-bospa-remote-indicator]')) mountRemoteIndicator();
              });
              observer.observe(document.documentElement, {subtree:true, childList:true});"""
          source=source.replace(old_observer,new_observer,1)

          source=source.replace(
            "checkInAt:`${input.checkIn}T${input.checkInTime || '14:00'}:00`,",
            "checkInAt:new Date(`${input.checkIn}T${input.checkInTime || '14:00'}:00`).toISOString(),",
            1,
          )
          source=source.replace(
            "checkOutAt:`${input.checkOut}T${input.checkOutTime || '12:00'}:00`,",
            "checkOutAt:new Date(`${input.checkOut}T${input.checkOutTime || '12:00'}:00`).toISOString(),",
            1,
          )

          if "const mutationStorage = globalThis.sessionStorage || globalThis.localStorage;" not in source:
            source=source.replace(
              "  const runtime = {\n    mode: 'detecting',",
              "  const mutationStorage = globalThis.sessionStorage || globalThis.localStorage;\n  const runtime = {\n    mode: 'detecting',",
              1,
            )
          source=source.replace("queue: safeJsonParse(localStorage.getItem(QUEUE_KEY), []),","queue: safeJsonParse(mutationStorage.getItem(QUEUE_KEY), []),",1)
          source=source.replace("localStorage.setItem(QUEUE_KEY, JSON.stringify(runtime.queue));","mutationStorage.setItem(QUEUE_KEY, JSON.stringify(runtime.queue));",1)
          if "mutationStorage.removeItem(QUEUE_KEY);" not in source:
            source=source.replace(
              "    runtime.mode = 'auth-required';\n    runtime.csrfToken = '';\n    renderAuthGate();",
              "    runtime.mode = 'auth-required';\n    runtime.csrfToken = '';\n    runtime.queue = [];\n    mutationStorage.removeItem(QUEUE_KEY);\n    renderAuthGate();",
              1,
            )

          required=[
            "__BOSPA_REMOTE_RUNTIME__",
            "new Date(`${input.checkIn}",
            "mutationStorage.getItem(QUEUE_KEY)",
            "mutationStorage.removeItem(QUEUE_KEY)",
            "if (!document.querySelector('[data-bospa-remote-indicator]'))",
          ]
          missing=[value for value in required if value not in source]
          if missing: raise SystemExit(f'missing runtime invariants: {missing}')
          runtime.write_text(source)

          sw=Path('public/sw.js')
          worker=sw.read_text()
          worker=re.sub(r"const CACHE = '[^']+';", "const CACHE = 'bospa-shell-v6';", worker, count=1)
          marker="  if (url.origin !== self.location.origin) return;\n"
          bypass="  if (url.pathname.startsWith('/api/')) {\n    event.respondWith(fetch(event.request, {cache: 'no-store'}));\n    return;\n  }\n"
          if bypass not in worker:
            if marker not in worker: raise SystemExit('service worker origin guard missing')
            worker=worker.replace(marker,marker+bypass,1)
          sw.write_text(worker)
          PY

          rm -f \
            .github/bospa-update.tar.gz.b64 \
            .github/ensure-bospa-update.trigger \
            .github/fix-remote-runtime.trigger \
            .github/fix-remote-datetime.trigger \
            .github/harden-service-worker.trigger \
            .github/harden-offline-queue.trigger \
            .github/consolidate-runtime.trigger \
            .github/workflows/apply-bospa-update.yml \
            .github/workflows/source-snapshot.yml \
            .github/workflows/ensure-bospa-update.yml \
            .github/workflows/fix-remote-runtime.yml \
            .github/workflows/fix-remote-datetime.yml \
            .github/workflows/harden-service-worker.yml \
            .github/workflows/harden-offline-queue.yml \
            .github/workflows/consolidate-runtime.yml

          npm ci --ignore-scripts
          npm run ci
          (cd server && go mod tidy && test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./... && go build -trimpath ./cmd/api)

          git config user.name 'bospa automation'
          git config user.email '94860628+aleka7sk@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(web): ship authenticated online-first Bospa runtime'
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
