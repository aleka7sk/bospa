name: harden-offline-queue
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths: [.github/harden-offline-queue.trigger]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Keep queued PII session-scoped
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('src/app-parts/00-remote-api-runtime.js')
          source=path.read_text()
          source=source.replace(
              "  const runtime = {\n    mode: 'detecting',",
              "  const mutationStorage = globalThis.sessionStorage || globalThis.localStorage;\n  const runtime = {\n    mode: 'detecting',",
              1,
          )
          source=source.replace(
              "    queue: safeJsonParse(localStorage.getItem(QUEUE_KEY), []),",
              "    queue: safeJsonParse(mutationStorage.getItem(QUEUE_KEY), []),",
              1,
          )
          source=source.replace(
              "    localStorage.setItem(QUEUE_KEY, JSON.stringify(runtime.queue));\n    localStorage.setItem(ID_MAP_KEY, JSON.stringify(runtime.idMap));",
              "    mutationStorage.setItem(QUEUE_KEY, JSON.stringify(runtime.queue));\n    localStorage.setItem(ID_MAP_KEY, JSON.stringify(runtime.idMap));",
              1,
          )
          source=source.replace(
              "    runtime.mode = 'auth-required';\n    runtime.csrfToken = '';\n    renderAuthGate();",
              "    runtime.mode = 'auth-required';\n    runtime.csrfToken = '';\n    runtime.queue = [];\n    mutationStorage.removeItem(QUEUE_KEY);\n    renderAuthGate();",
              1,
          )
          if "mutationStorage.getItem(QUEUE_KEY)" not in source or "mutationStorage.removeItem(QUEUE_KEY)" not in source:
              raise SystemExit('offline queue hardening patch did not apply')
          path.write_text(source)
          PY
          rm -f .github/harden-offline-queue.trigger .github/workflows/harden-offline-queue.yml
          npm ci --ignore-scripts
          npm run ci
          git config user.name 'bospa automation'
          git config user.email '94860628+aleka7sk@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security(web): keep queued booking PII session scoped'
          git push origin "HEAD:${GITHUB_REF_NAME}"
