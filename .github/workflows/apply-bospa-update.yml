name: apply-bospa-update
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths:
      - .github/bospa-update/READY
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared source update
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml /tmp/bospa-ci.yml
          cat .github/bospa-update/part-* > /tmp/bospa-update.tar.gz.b64
          base64 --decode /tmp/bospa-update.tar.gz.b64 > /tmp/bospa-update.tar.gz
          tar -xzf /tmp/bospa-update.tar.gz
          cp /tmp/bospa-ci.yml .github/workflows/ci.yml
          rm -rf .github/bospa-update
          git config user.name "bospa automation"
          git config user.email "94860628+aleka7sk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(web): connect PWA to authenticated Bospa API"
          git push origin "HEAD:${GITHUB_REF_NAME}"
