name: fix-remote-runtime
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths:
      - .github/fix-remote-runtime.trigger
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prevent sync-indicator observer feedback loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app-parts/00-remote-api-runtime.js')
          source = path.read_text()
          old = """    const observer = new MutationObserver(() => mountRemoteIndicator());
              observer.observe(document.documentElement, {subtree:true, childList:true});"""
          new = """    const observer = new MutationObserver(() => {
                if (!document.querySelector('[data-bospa-remote-indicator]')) mountRemoteIndicator();
              });
              observer.observe(document.documentElement, {subtree:true, childList:true});"""
          if old not in source:
              raise SystemExit('expected remote indicator observer block was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -f .github/fix-remote-runtime.trigger
          rm -f .github/workflows/fix-remote-runtime.yml
          npm ci --ignore-scripts
          npm run ci
          git config user.name "bospa automation"
          git config user.email "94860628+aleka7sk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(web): prevent remote sync indicator observer loop"
          git push origin "HEAD:${GITHUB_REF_NAME}"
