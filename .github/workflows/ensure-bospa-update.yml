name: ensure-bospa-update
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths:
      - .github/ensure-bospa-update.trigger
permissions:
  contents: write
concurrency:
  group: ensure-bospa-update
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pending authenticated web integration
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/bospa-update.tar.gz.b64 ]; then
            base64 --decode .github/bospa-update.tar.gz.b64 > /tmp/bospa-update.tar.gz
            tar -tzf /tmp/bospa-update.tar.gz >/tmp/bospa-update-files.txt
            tar -xzf /tmp/bospa-update.tar.gz
          fi
          rm -f .github/bospa-update.tar.gz.b64
          rm -f .github/ensure-bospa-update.trigger
          rm -f .github/workflows/apply-bospa-update.yml
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/workflows/ensure-bospa-update.yml
          git config user.name "bospa automation"
          git config user.email "94860628+aleka7sk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No pending source update was found"
            exit 0
          fi
          git commit -m "feat(web): connect PWA to authenticated Bospa API"
          git push origin "HEAD:${GITHUB_REF_NAME}"
