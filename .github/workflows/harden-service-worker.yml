name: harden-service-worker
on:
  push:
    branches: ["feat/bospa-pwa-v1"]
    paths: [.github/harden-service-worker.trigger]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Never cache authenticated API responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('public/sw.js')
          source=path.read_text()
          source=re.sub(r"const CACHE = '[^']+';", "const CACHE = 'bospa-shell-v6';", source, count=1)
          marker="  if (url.origin !== self.location.origin) return;\n"
          addition="  if (url.pathname.startsWith('/api/')) {\n    event.respondWith(fetch(event.request, {cache: 'no-store'}));\n    return;\n  }\n"
          if addition not in source:
              if marker not in source:
                  raise SystemExit('service worker origin guard not found')
              source=source.replace(marker, marker+addition, 1)
          path.write_text(source)
          PY
          rm -f .github/harden-service-worker.trigger .github/workflows/harden-service-worker.yml
          npm ci --ignore-scripts
          npm run ci
          git config user.name 'bospa automation'
          git config user.email '94860628+aleka7sk@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security(pwa): never cache authenticated API responses'
          git push origin "HEAD:${GITHUB_REF_NAME}"
