services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: bospa
      POSTGRES_USER: bospa
      POSTGRES_PASSWORD: ${BOSPA_POSTGRES_PASSWORD:-bospa-local-only-change-me}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - bospa_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bospa -d bospa"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      BOSPA_HTTP_ADDR: :8080
      BOSPA_DATABASE_URL: postgres://bospa:${BOSPA_POSTGRES_PASSWORD:-bospa-local-only-change-me}@db:5432/bospa?sslmode=disable
      BOSPA_PUBLIC_ORIGIN: http://localhost:4173
      BOSPA_ALLOWED_ORIGINS: http://localhost:4173
      BOSPA_COOKIE_SECURE: "false"
      BOSPA_AUTO_MIGRATE: "true"
      BOSPA_BOOTSTRAP_OWNER_EMAIL: ${BOSPA_BOOTSTRAP_OWNER_EMAIL:-owner@bospa.local}
      BOSPA_BOOTSTRAP_OWNER_PASSWORD: ${BOSPA_BOOTSTRAP_OWNER_PASSWORD:-bospa-local-owner-2026!}
      BOSPA_BOOTSTRAP_OWNER_NAME: ${BOSPA_BOOTSTRAP_OWNER_NAME:-Алишер Толегенов}
      BOSPA_BOOTSTRAP_WORKSPACE: ${BOSPA_BOOTSTRAP_WORKSPACE:-Arman Apartments}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: .
    restart: unless-stopped
    environment:
      BOSPA_API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "4173:4173"

volumes:
  bospa_postgres:
